<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Golden Royal Ark School Portal</title>
    <script>
      // Applies the stored theme before first paint. Without this the page
      // renders light, then snaps to dark once React hydrates the store.
      // Kept in sync with STORAGE_KEY in src/stores/theme-store.ts.
      (function () {
        try {
          var raw = localStorage.getItem('gra.theme');
          var preference = raw ? JSON.parse(raw).state.preference : 'system';
          var dark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (_) {
          /* Storage blocked or malformed — fall through to the light default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
