# Netlify build for the PUBLIC WEBSITE (goldenroyalark.com).
#
# This is its own Netlify site, separate from the admin app (the repo-root netlify.toml, base = frontend).
# In the Netlify UI set:  Site configuration → Build & deploy → Base directory = website
# Netlify then reads THIS file. Next.js is detected automatically and deployed with the Netlify Next.js
# runtime (server rendering, route handlers for /api/contact, and the Image CDN behind next/image).

[build]
  command = "npm run build"
  publish = ".next"

# The Next.js runtime turns .next into a deployable site (server handler, routing, Image CDN). Netlify is
# meant to add it automatically, but on this site it detected Next.js and skipped the runtime anyway:
# 0 functions were uploaded and every URL returned Netlify's 404. Declared explicitly so the deploy never
# depends on auto-detection.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Non-secret values that differ by environment are NOT set here: both the production site and every deploy
# preview read this file. Set them per deploy context in the Netlify UI (Site configuration → Environment
# variables), using .env.example as the checklist. Secrets (RESEND_API_KEY) only ever live in the UI.

# Deploy previews and branch deploys (including a `staging` branch deploy) must never be indexed, or
# Google sees duplicate copies of the site, and must never send parents to the live result portal.
# Production sets neither: it uses the defaults in config/env.ts (results.goldenroyalark.com).
[context.deploy-preview.environment]
  NEXT_PUBLIC_SITE_ENV = "preview"
  NEXT_PUBLIC_RESULT_PORTAL_URL = "https://staging-api.goldenroyalark.com/portal"

[context.branch-deploy.environment]
  NEXT_PUBLIC_SITE_ENV = "preview"
  NEXT_PUBLIC_RESULT_PORTAL_URL = "https://staging-api.goldenroyalark.com/portal"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
