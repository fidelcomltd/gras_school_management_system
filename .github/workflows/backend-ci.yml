# Thin wrapper: all gate logic lives in backend/scripts/ci.ps1, so the identical gates run locally.
# Do not reimplement steps here — change the script.

name: backend-ci

on:
  push:
    # `staging` added 2026-09-16 (human directive). Until then CI watched `main` only, while all
    # real work happened on `staging` — so the full integration suite was never running off-machine
    # and the orchestrator paid ~1 hour locally per card against hosted Neon to substitute for it.
    # The runner's postgres service container is local to the job, so the same suite costs minutes
    # here. This trigger is what makes the scoped local gate in `.agent/rules/gates.md` safe.
    branches: [main, staging]
    paths:
      - 'backend/**'
      - 'contracts/**'          # a contract change must re-run the drift check
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'contracts/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read                # least privilege: the workflow only needs to read the repo

concurrency:
  # Supersede an in-flight run for the same ref: the older result is irrelevant once new commits land.
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # THIS IS WHAT MAKES THE INTEGRATION TESTS ACTUALLY RUN. Without it they SKIP, and the suite
        # silently shrinks to unit and architecture tests while still reporting success.
        # Pinned to a specific minor version, matching DatabaseAvailability.PostgresImage.
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: ci_user
          # Ephemeral credentials for a container that exists only for this job and is reachable only
          # from it. Not a secret, and deliberately not stored as one: a GitHub secret here would imply
          # it needed protecting and obscure that it is throwaway.
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: schoolmanagement_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history: gitleaks scans commits, and a shallow clone would leave most of them unscanned
          # while still reporting a clean result.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # Read from backend/global.json so the SDK version has exactly one source of truth.
          global-json-file: backend/global.json

      - name: Report the resolved SDK
        working-directory: backend
        # TASK-0024: which SDK CI actually used was, until now, something we INFERRED. `global.json`
        # said 10.0.100 with `rollForward: latestFeature`, which silently let CI take a newer
        # feature band than any developer had — and feature bands, not patches, carry new analyzer
        # versions. That is how CA2025 and CA1873 failed here while Format and Build were green on
        # every local machine. `rollForward` is now `latestPatch`, and this step makes the resolved
        # version visible in the log so the next divergence is read, not deduced.
        run: dotnet --version

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Keyed on the lock-equivalent inputs. Central Package Management means Directory.Packages.props
          # fully determines the restore graph.
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install gitleaks
        run: |
          set -euo pipefail
          # MUST match the version developers run locally, and STATE.md records the pin.
          # TASK-0024: at 8.28.0 this gate reported 15 leaks on a tree that 8.30.1 reports clean —
          # same repo, same 21 commits, same .gitleaks.toml. TASK-0011's `[[allowlists]]` +
          # `regexTarget = "match"` fix is not honoured identically by 8.28.0, so the older binary
          # sees 15 non-secrets it was explicitly taught to ignore. A scanner whose verdict depends
          # on which machine ran it is not a gate. Bumping this without bumping local (or vice
          # versa) re-creates exactly that split.
          version="8.30.1"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Restore local tools
        working-directory: backend
        run: dotnet tool restore

      - name: Self-test the gate-summary trx parser
        working-directory: backend
        shell: pwsh
        # Runs before the real gates so a broken parser fails fast, cheaply, on fixtures alone —
        # not after a full build and a database round trip.
        run: ./scripts/tests/gate-summary.tests.ps1

      - name: Self-test the postgres-test-connection resolver
        working-directory: backend
        shell: pwsh
        # Same reason as the step above, and one more: this resolver decides whether the
        # integration tests RUN or skip. A silent regression in it turns a green run into a green
        # run that tested less — the exact failure mode TASK-0008 and §13 exist to stop. A
        # self-test that never executes in CI is TASK-0011's defect wearing a different hat.
        run: ./scripts/tests/postgres-test-connection.tests.ps1

      - name: Self-test the secret-scan working-tree branch
        working-directory: backend
        shell: pwsh
        # Gate 9 runs two gitleaks passes; the second (--no-git) is the only one that can see an
        # uncommitted change, which is the shape every dispatch is actually gated in. This proves
        # the second pass still fires by planting a fake secret in a never-committed file — the
        # branch is otherwise indistinguishable from a no-op whenever the tree happens to be clean.
        run: ./scripts/tests/secret-scan-working-tree.tests.ps1

      - name: Run all quality gates
        working-directory: backend
        shell: pwsh
        env:
          CI: 'true'
          # Supplying this makes the integration tests RUN rather than skip. Host is 'localhost' because
          # the service container's port is published to the runner.
          POSTGRES_TEST_CONNECTION: 'Host=localhost;Port=5432;Database=schoolmanagement_ci;Username=ci_user;Password=ci_password'
        # -NoFailFast: CI wants the full picture from one run rather than stopping at the first
        # failing gate, so a contributor sees every problem instead of re-triggering per fix.
        run: ./scripts/ci.ps1 -Configuration Release -NoFailFast

      - name: Assert the integration tests were not skipped
        if: always()
        working-directory: backend
        shell: pwsh
        run: |
          # A guard against the failure mode this whole file is designed to avoid: the suite passing
          # because the integration tests quietly skipped. If PostgreSQL was unreachable, the tests skip
          # by design and everything else still goes green — so CI has to check explicitly.
          #
          # Every trx is inspected (one per test project), and the skip count is DERIVED as
          # total - passed - failed. xunit v3's Assert.Skip does not increment the trx `notExecuted`
          # counter, so reading that attribute would report zero skips for a fully skipped project.
          $trxFiles = @(Get-ChildItem ./artifacts/coverage -Filter '*.trx' -ErrorAction SilentlyContinue)

          if ($trxFiles.Count -eq 0) {
            Write-Host '::error::No test results file found; cannot verify the integration tests ran.'
            exit 1
          }

          $skipped = 0
          foreach ($trx in $trxFiles) {
            [xml]$results = Get-Content $trx.FullName -Raw
            $c = $results.TestRun.ResultSummary.Counters
            $notRun = [int]$c.total - [int]$c.passed - [int]$c.failed
            Write-Host "$($trx.Name): total=$($c.total) passed=$($c.passed) failed=$($c.failed) notRun=$notRun"
            if ($notRun -gt 0) { $skipped += $notRun }
          }

          if ($skipped -gt 0) {
            Write-Host "::error::$skipped test(s) were SKIPPED. The integration tests require PostgreSQL; a skip means they verified nothing. Check the postgres service container and POSTGRES_TEST_CONNECTION."
            exit 1
          }

          Write-Host "No tests were skipped."

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/artifacts/coverage/**
          retention-days: 14

      - name: Upload the generated OpenAPI document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Useful on a drift failure: download it and diff against the committed contract.
          name: backend-openapi
          path: backend/artifacts/openapi/**
          retention-days: 14
