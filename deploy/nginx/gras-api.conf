# The admin API: https://api.goldenroyalark.com  ->  Kestrel on 127.0.0.1:5000
#
# Hostname confirmed by the human 2026-09-22. The frontend's origin must share the registrable
# domain with this one (app.goldenroyalark.com), or the __Host- session cookie (SameSite=Lax) is
# never sent and every sign-in fails.
#
# TLS lines are added by `certbot --nginx`; this file is what it edits, so keep it minimal.

server {
    listen 80;
    listen [::]:80;
    server_name api.goldenroyalark.com;

    # certbot's HTTP-01 challenge, and nothing else, is served over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.goldenroyalark.com;

    # ssl_certificate / ssl_certificate_key are inserted here by certbot.

    # Must not be BELOW the app's own largest accepted request, or nginx answers an HTML 413 and
    # the app's clean, typed rejection never runs. The biggest is the logo upload: 2 MiB of image
    # (ISchoolImageProcessor.MaxLogoBytes) plus 64 KiB of multipart overhead
    # (SettingsEndpoints.MultipartOverheadBytes). 4m leaves headroom without inviting large bodies;
    # everything else is capped tighter by the app itself (RequestLimits:MaxRequestBodyBytes).
    client_max_body_size 4m;

    # Long enough for a result-sheet PDF render on a small box, short enough that a wedged request
    # does not hold a worker forever.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    access_log /var/log/nginx/gras-api.access.log;
    error_log /var/log/nginx/gras-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # THESE FOUR HEADERS ARE LOAD-BEARING. The app reads X-Forwarded-For and -Proto (its Proxy
        # section trusts this proxy by address) for the rate limiter's partition key, the portal's
        # per-address pin limits and every audit row's source_ip. Host is passed through unchanged
        # because AllowedHosts is checked against it.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No buffering of responses: PDF downloads stream straight through.
        proxy_buffering off;
    }

    # The liveness probe is noise in the access log and answers no dependency question.
    location = /health/live {
        proxy_pass http://127.0.0.1:5000/health/live;
        proxy_set_header Host $host;
        access_log off;
    }
}
