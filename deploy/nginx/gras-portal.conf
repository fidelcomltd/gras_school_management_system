# The parent result portal: https://results.goldenroyalark.com  ->  the SAME Kestrel on 127.0.0.1:5000
#
# CONFIRM THE HOSTNAME BEFORE THE FIRST PIN BATCH IS PRINTED. It is printed on every slip and
# encoded into every result QR code (Portal__PublicUrl), and slips already handed to parents cannot
# be corrected.
#
# One process serves both hosts (human ruling 2026-09-22: the portal is server-rendered by the API,
# not a separate deployment). The separation here is by hostname, so parents never see an admin URL
# and the two can be given different edge limits.

server {
    listen 80;
    listen [::]:80;
    server_name results.goldenroyalark.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name results.goldenroyalark.com;

    # ssl_certificate / ssl_certificate_key are inserted here by certbot.

    # Parents submit a reg number and a pin: nothing here is an upload.
    client_max_body_size 64k;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    access_log /var/log/nginx/gras-portal.access.log;
    error_log /var/log/nginx/gras-portal.error.log;

    # The app serves the portal under /portal (PortalEndpoints), so the bare hostname is redirected
    # there rather than 404ing: https://results.goldenroyalark.com is what is printed on a pin slip,
    # and it has to land somewhere sensible.
    location = / {
        return 302 /portal;
    }

    # Only the portal's own routes are reachable on this hostname. The admin API is NOT: a parent
    # who guesses /api/v1/pupils on this host gets a 404 from Nginx and never reaches the app. The
    # app would answer 401 anyway, so this is defence in depth, not the control itself.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    location /api/ {
        return 404;
    }

    location /openapi/ {
        return 404;
    }
}
